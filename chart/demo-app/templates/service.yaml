# The Service name is fixed, so the in-cluster URL is always
# http://demo-app.<namespace>.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "demo-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
