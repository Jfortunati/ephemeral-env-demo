image:
  repository: ghcr.io/jfortunati/ephemeral-env-demo
  tag: main
  pullPolicy: IfNotPresent

# Shown in the app's banner, so a viewer can see which environment served the page.
envName: local
prNumber: ""
commitSha: ""

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

namespace:
  # When true, the chart renders a Namespace for the release namespace.
  # Argo CD uses this so the namespace belongs to the Application and is deleted with it.
  create: false

testkubeHook:
  # When true, renders an Argo CD PostSync hook Job that starts the end-to-end
  # tests in Testkube once the app is healthy. Enabled only by the Argo CD ApplicationSet.
  enabled: false
  # Namespace that holds the "testkube-api" secret the hook Job reads.
  namespace: demo-ops
  workflow: demo-app-e2e
  runner: jf-minikube
  cliImage: kubeshop/testkube-cli:2.15.2
  ttlSecondsAfterFinished: 3600
