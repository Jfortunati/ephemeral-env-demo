name: Build app image

# Builds the app image and pushes it to GitHub Container Registry.
# Deployment is not done here: Argo CD picks up pull requests and deploys them.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Full commit SHA. For pull requests this is the head commit, which is what Argo CD deploys.
            type=raw,value=sha-${{ github.event.pull_request.head.sha || github.sha }}
            # pr-<number> on pull request events
            type=ref,event=pr
            # main on pushes to main
            type=raw,value=main,enable={{is_default_branch}}

      # Build for both Intel and ARM, so the image runs on cloud clusters and on Apple silicon laptops.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
