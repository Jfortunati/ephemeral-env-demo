# Permissions for the demo-app-ephemeral Testkube workflow.
#
# The workflow creates a fresh namespace, installs the app with Helm, runs the tests,
# then uninstalls the app and deletes the namespace. This ServiceAccount is used only
# by that workflow's pod; other workflows on the same runner do not get these rights.
#
# A ClusterRole is needed because the namespace does not exist before the run, so a
# namespaced Role cannot be bound to it in advance. The rules below are limited to the
# resource types the Helm chart contains, plus what Helm needs to track and wait on them.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app-ephemeral
  # The namespace where the Testkube runner starts workflow pods.
  namespace: testkube
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-app-ephemeral
rules:
  # Create the per-run namespace and delete it at teardown.
  # Helm 4 creates it with server-side apply, which needs "patch";
  # "watch" lets kubectl wait for the namespace to be gone.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # The app's own resources, as rendered by chart/demo-app.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Helm stores release history as Secrets in the release namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Read-only: lets "helm --wait" check rollout status and lets the
  # workflow print pod status and events when a deploy fails.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-app-ephemeral
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-app-ephemeral
subjects:
  - kind: ServiceAccount
    name: demo-app-ephemeral
    namespace: testkube
